<section class="card mb-3 border-danger" data-push-panel aria-label="Alertas de emergencia">
 <div class="card-body">
  <h2 class="h5"><a href="{% url 'sos_guardia' %}" class="text-danger">Emergencias SOS</a></h2>
  {% csrf_token %}
  <p class="small" data-push-status role="status">Activa las notificaciones para recibir SOS mientras tu sesión de guardia esté vigente. Pueden mostrar el nombre del residente y su casa en la pantalla bloqueada.</p>
  <button class="btn btn-danger" type="button" data-push-enable>Activar notificaciones SOS</button>
  <button class="btn btn-outline-secondary" type="button" data-push-disable>Desactivar en este dispositivo</button>
  <div data-sos-live aria-live="polite" class="mt-2"></div>
 </div>
</section>
