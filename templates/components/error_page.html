<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }} · Residencia Segura</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; color: #153b63; font: 16px/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 440px; padding: 32px; border-radius: 24px; background: white; box-shadow: 0 8px 32px #153b6310; }
    h1 { font-size: 24px; line-height: 1.3; }
    p { color: #526171; }
    a { display: inline-block; padding: 12px 20px; border-radius: 12px; background: #0969b5; color: white; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body><main role="alert"><strong>Residencia Segura</strong><h1>{{ titulo }}</h1><p>{{ mensaje }}</p><a href="{{ destino|default:'/' }}">{{ accion|default:'Volver al inicio' }}</a></main></body>
</html>
