{% if form.errors %}
<div class="alert alert-danger form-error-summary" role="alert" tabindex="-1" data-form-errors>
  <strong>Revisa estos datos para continuar</strong>
  <ul class="mb-0 mt-2">
    {% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}
    {% for field in form %}{% for error in field.errors %}
    <li><a class="alert-link" href="#{{ field.id_for_label }}">{{ field.label }}: {{ error }}</a></li>
    {% endfor %}{% endfor %}
  </ul>
</div>
{% endif %}
