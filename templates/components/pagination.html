{% load app_tags %}{% if page_obj.has_other_pages %}<nav class="mt-3" aria-label="Paginación"><ul class="pagination justify-content-center"><li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">{% if page_obj.has_previous %}<a class="page-link" href="?{% query_transform page=page_obj.previous_page_number %}">Anterior</a>{% else %}<span class="page-link">Anterior</span>{% endif %}</li><li class="page-item disabled"><span class="page-link">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span></li><li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">{% if page_obj.has_next %}<a class="page-link" href="?{% query_transform page=page_obj.next_page_number %}">Siguiente</a>{% else %}<span class="page-link">Siguiente</span>{% endif %}</li></ul></nav>{% endif %}
