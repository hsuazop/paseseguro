<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificación de acceso</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:520px"><div class="card border-0 shadow-sm rounded-4"><div class="card-body text-center p-5">{% if valido %}<div class="display-3 text-success">✓</div><h1 class="h3">Acceso válido</h1><p class="text-muted">{{ casa.colonia.nombre }}</p><p class="fs-4 fw-bold">Casa {{ casa.codigo }}</p><div class="alert alert-success">Código personal verificado.</div>{% else %}<div class="display-3 text-danger">×</div><h1 class="h3">Código no válido</h1><p class="text-muted">El código expiró o no corresponde a una residencia activa.</p>{% endif %}</div></div></main></body></html>
