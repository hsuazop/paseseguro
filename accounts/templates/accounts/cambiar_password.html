{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-md-7 col-lg-5"><div class="card"><div class="card-body p-4"><h1 class="h3">Cambiar contraseña</h1><p class="text-muted">Por seguridad, reemplace la contraseña temporal antes de continuar.</p><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary btn-lg w-100">Actualizar contraseña</button></form></div></div></div></div>
{% endblock %}
